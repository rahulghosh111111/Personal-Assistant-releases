<style>
.ping{fill:none;stroke:#ff5fa8;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 3.6s cubic-bezier(.2,.6,.3,1) infinite}
.ping2{animation-delay:1.2s}.ping3{animation-delay:2.4s}
@keyframes ping{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.flow{stroke-dasharray:5 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.live{animation:live 1.6s ease-in-out infinite}
@keyframes live{50%{opacity:.25}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.3s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
