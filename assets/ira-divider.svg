<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" aria-hidden="true">
<title id="t"></title>
<style>
.ping{fill:none;stroke:#ff5fa8;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 3.6s cubic-bezier(.2,.6,.3,1) infinite}
.ping2{animation-delay:1.2s}.ping3{animation-delay:2.4s}
@keyframes ping{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.flow{stroke-dasharray:5 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.live{animation:live 1.6s ease-in-out infinite}
@keyframes live{50%{opacity:.25}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.3s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#130a22"/><stop offset=".55" stop-color="#1c0d2c"/><stop offset="1" stop-color="#2a0b31"/>
</linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff5fa8"/><stop offset=".5" stop-color="#e040c8"/><stop offset="1" stop-color="#8b5cf6"/>
</linearGradient>
<linearGradient id="brandWide" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
  <stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#e040c8"/><stop offset="1" stop-color="#ff5fa8"/>
</linearGradient>
<radialGradient id="orb" cx=".36" cy=".3" r=".8">
  <stop offset="0" stop-color="#ff86c0"/><stop offset=".45" stop-color="#e23fd0"/><stop offset="1" stop-color="#7a3cff"/>
</radialGradient>
<radialGradient id="orbShade" cx=".5" cy=".5" r=".5">
  <stop offset=".62" stop-color="#1e0032" stop-opacity="0"/><stop offset="1" stop-color="#1e0032" stop-opacity=".45"/>
</radialGradient>
<radialGradient id="glowPink"><stop offset="0" stop-color="#e040c8" stop-opacity=".42"/><stop offset="1" stop-color="#e040c8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowViolet"><stop offset="0" stop-color="#7c4dff" stop-opacity=".28"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient>
<radialGradient id="comet"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ff5fa8" stop-opacity=".9"/><stop offset="1" stop-color="#e040c8" stop-opacity="0"/></radialGradient>
<radialGradient id="cometGrey"><stop offset="0" stop-color="#ffffff" stop-opacity=".8"/><stop offset=".4" stop-color="#9d92b6" stop-opacity=".7"/><stop offset="1" stop-color="#9d92b6" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M0 1L9 5L0 9Z" fill="#c4b5fd" fill-opacity=".7"/>
</marker>
<clipPath id="card"><rect width="1000" height="24" rx="22"/></clipPath><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".25" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset=".5" stop-color="#e040c8"/><stop offset=".75" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#ff5fa8" stop-opacity="0"/><stop offset=".5" stop-color="#ff5fa8"/><stop offset="1" stop-color="#ff5fa8" stop-opacity="0"/></linearGradient></defs>
<line x1="0" y1="12" x2="1000" y2="12" stroke="url(#fade)" stroke-width="2.5" stroke-linecap="round"/>
<rect x="-220" y="10.5" width="220" height="3" rx="1.5" fill="url(#spark)"><animate attributeName="x" values="-220;1000" dur="4.5s" repeatCount="indefinite"/></rect>
<circle class="ping" cx="500" cy="12" r="5"/>
<circle cx="500" cy="12" r="4.5" fill="#ff5fa8"/>
</svg>
