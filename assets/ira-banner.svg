 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<rect width="1600" height="440" rx="34" fill="url(#bg)"/>
<circle cx="1300" cy="90" r="170" fill="#6d5dfc" opacity=".28" filter="url(#blur)"/>
<circle cx="250" cy="400" r="190" fill="#06b6d4" opacity=".18" filter="url(#blur)"/>
