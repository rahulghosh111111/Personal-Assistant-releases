<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="t d">
<title id="t">Ira Assistant</title><desc id="d">A modern dark banner for Ira Assistant, a voice-locked Windows desktop assistant.</desc>
